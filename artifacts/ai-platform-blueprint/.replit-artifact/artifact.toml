kind = "web"
previewPath = "/"
title = "AI Platform Blueprint"
description = "An interactive architecture cockpit for planning a secure, repeatable Azure AI platform across identity, models, data, integrations, observability, and developer enablement."
version = "1.0.0"
id = "artifacts/ai-platform-blueprint"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20436

[services.development]
run = "pnpm --filter @workspace/ai-platform-blueprint run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-platform-blueprint", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-platform-blueprint/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20436"
BASE_PATH = "/"
