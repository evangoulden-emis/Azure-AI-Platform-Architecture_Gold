openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: platform
    description: Azure AI platform blueprint operations
  - name: governed-workload
    description: Non-production governed workload proof
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /platform/overview:
    get:
      operationId: getPlatformOverview
      tags: [platform]
      summary: Get the current platform overview
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOverview"
  /platform/capabilities:
    get:
      operationId: listPlatformCapabilities
      tags: [platform]
      summary: List platform capability layers
      responses:
        "200":
          description: Capability layers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformCapability"
  /platform/controls:
    get:
      operationId: listPlatformControls
      tags: [platform]
      summary: List platform controls
      responses:
        "200":
          description: Platform controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformControl"
  /platform/roadmap:
    get:
      operationId: listPlatformRoadmap
      tags: [platform]
      summary: List platform roadmap work
      responses:
        "200":
          description: Roadmap work
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoadmapItem"
  /platform/decisions:
    get:
      operationId: listArchitectureDecisions
      tags: [platform]
      summary: List architecture decisions
      responses:
        "200":
          description: Architecture decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchitectureDecision"
  /platform/decisions/{decisionId}:
    patch:
      operationId: updateArchitectureDecision
      tags: [platform]
      summary: Update an architecture decision status
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer identity with the Architecture.Decision.Update role
          schema: { type: string }
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchitectureDecisionUpdate"
      responses:
        "200":
          description: Updated architecture decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureDecision"
        "401":
          description: Missing or invalid bearer identity
        "403":
          description: Identity lacks architecture decision update permission
        "404":
          description: Decision not found
  /v1/responses:
    post:
      operationId: createGovernedResponse
      tags: [governed-workload]
      summary: Execute the governed claims-assistant proof workload
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
        - name: x-api-version
          in: header
          required: true
          schema: { type: string, enum: ["2026-09-01"] }
        - name: x-correlation-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernedResponseInput"
      responses:
        "200":
          description: Governed response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernedResponse"
        "400": { description: Invalid request or API version }
        "401": { description: Missing Entra bearer identity }
        "403": { description: "Workload, safety, or retrieval policy blocked" }
        "429": { description: Workload quota exceeded }
  /platform/pilot/evidence:
    get:
      operationId: getPilotEvidence
      tags: [governed-workload]
      summary: Get normalized control evidence for the pilot
      responses:
        "200":
          description: Pilot evidence register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotEvidenceRegister"
  /platform/pilot/retrieval/{sourceId}:
    delete:
      operationId: deletePilotRetrievalSource
      tags: [governed-workload]
      summary: Delete a pilot source and verify it is no longer retrievable
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
        - name: sourceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deletion verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionEvidence"
        "401": { description: Missing or invalid administrative identity }
        "403": { description: Application is not authorized to delete sources }
        "404": { description: Source not found }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PlatformOverview:
      type: object
      required:
        - platformName
        - environment
        - regionPolicy
        - readinessScore
        - activeUsers
        - capabilityCount
        - controlCount
        - roadmapCount
        - nextMilestone
        - lastReviewed
      properties:
        platformName:
          type: string
        environment:
          type: string
        regionPolicy:
          type: string
        readinessScore:
          type: integer
        activeUsers:
          type: integer
        capabilityCount:
          type: integer
        controlCount:
          type: integer
        roadmapCount:
          type: integer
        nextMilestone:
          type: string
        lastReviewed:
          type: string
    PlatformCapability:
      type: object
      required:
        - id
        - name
        - description
        - status
        - owner
        - services
        - readiness
        - accent
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        owner:
          type: string
        services:
          type: array
          items:
            type: string
        readiness:
          type: integer
        accent:
          type: string
    PlatformControl:
      type: object
      required:
        - id
        - name
        - category
        - description
        - status
        - owner
        - evidence
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        status:
          type: string
        owner:
          type: string
        evidence:
          type: string
    RoadmapItem:
      type: object
      required:
        - id
        - phase
        - title
        - description
        - status
        - horizon
        - owner
        - dependencies
      properties:
        id:
          type: string
        phase:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        horizon:
          type: string
        owner:
          type: string
        dependencies:
          type: array
          items:
            type: string
    ArchitectureDecision:
      type: object
      required:
        - id
        - title
        - area
        - recommendation
        - rationale
        - status
        - owner
      properties:
        id:
          type: string
        title:
          type: string
        area:
          type: string
        recommendation:
          type: string
        rationale:
          type: string
        status:
          type: string
        owner:
          type: string
    ArchitectureDecisionUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Proposed
            - Accepted
            - Needs review
    GovernedMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user] }
        content: { type: string, minLength: 1, maxLength: 4000 }
    RetrievalInput:
      type: object
      required: [index, top_k, require_citations]
      properties:
        index: { type: string }
        top_k: { type: integer, minimum: 1, maximum: 5 }
        require_citations: { type: boolean }
    ResponsePolicyInput:
      type: object
      required: [max_output_tokens, human_review_on]
      properties:
        max_output_tokens: { type: integer, minimum: 1, maximum: 800 }
        human_review_on:
          type: array
          items: { type: string }
    GovernedResponseInput:
      type: object
      required: [workload_id, model_route, input, retrieval, tools, response_policy]
      properties:
        workload_id: { type: string }
        model_route: { type: string }
        input:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/GovernedMessage" }
        retrieval: { $ref: "#/components/schemas/RetrievalInput" }
        tools:
          type: array
          maxItems: 0
          items: { type: string }
        response_policy: { $ref: "#/components/schemas/ResponsePolicyInput" }
    Citation:
      type: object
      required: [source_id, title]
      properties:
        source_id: { type: string }
        title: { type: string }
    GovernedOutput:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string }
    SafetyResult:
      type: object
      required: [status, policy_version, aidr_request, aidr_response, native_safety]
      properties:
        status: { type: string }
        policy_version: { type: string }
        aidr_request: { type: string }
        aidr_response: { type: string }
        native_safety: { type: string }
    Usage:
      type: object
      required: [input_tokens, output_tokens, estimated_cost]
      properties:
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        estimated_cost: { type: number }
    GovernedResponse:
      type: object
      required: [id, status, model_route, output, citations, safety, usage, trace_id]
      properties:
        id: { type: string }
        status: { type: string }
        model_route: { type: string }
        output:
          type: array
          items: { $ref: "#/components/schemas/GovernedOutput" }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        safety: { $ref: "#/components/schemas/SafetyResult" }
        usage: { $ref: "#/components/schemas/Usage" }
        trace_id: { type: string }
    EvidenceItem:
      type: object
      required: [control, status, owner, collected_at, target, rule_version, evidence_hash, summary]
      properties:
        control: { type: string }
        status: { type: string, enum: [passed, pending] }
        owner: { type: string }
        collected_at: { type: string }
        target: { type: string }
        rule_version: { type: string }
        evidence_hash: { type: string }
        summary: { type: string }
    PilotEvidenceRegister:
      type: object
      required: [workload_id, environment, mode, evidence]
      properties:
        workload_id: { type: string }
        environment: { type: string }
        mode: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceItem" }
    DeletionEvidence:
      type: object
      required: [source_id, deleted, retrieval_matches_after_delete, cache_entries_removed, evidence_hash]
      properties:
        source_id: { type: string }
        deleted: { type: boolean }
        retrieval_matches_after_delete: { type: integer }
        cache_entries_removed: { type: integer }
        evidence_hash: { type: string }

